<!doctype html>
<html>
  <head>

    <title>PR Docent</title>
    <style>
      body { margin: 0 auto; padding: 40px 20px 56px; max-width: 640px; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: #1f2328; background: #fff; }
      header { display: flex; align-items: center; gap: 12px; }
      header img { width: 48px; height: 48px; }
      h1 { margin: 0; font-size: 24px; }
      h2 { margin: 28px 0 8px; font-size: 17px; }

      a { color: #0969da; }
      .demo { display: inline-block; margin-top: 4px; padding: 9px 18px; border-radius: 8px; background: #8250df; color: #fff; text-decoration: none; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        body { color: #f0f6fc; background: #0d1117; }
        p, li { color: #9198a1; }
        code { background: #151b23; }
        a { color: #4493f8; }

    </ul>

    <h2 data-i18n="welcomeMoreTitle"></h2>
    <p data-i18n="welcomeMore"></p>
    <script type="module" src="src/welcome.js"></script>
