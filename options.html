<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PR Docent</title>
    <style>
      body { margin: 0 auto; padding: 24px 16px 40px; max-width: 720px; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; color: #1f2328; background: #fff; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      h2 { margin: 20px 0 6px; font-size: 16px; }
      p, li { color: #59636e; }
      ul { margin: 6px 0; padding-left: 20px; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; padding: 1px 4px; border-radius: 4px; background: #f6f8fa; }
      textarea { box-sizing: border-box; width: 100%; min-height: 280px; padding: 10px; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical; border: 1px solid #d1d9e0; border-radius: 6px; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      button { padding: 5px 14px; font: inherit; border-radius: 6px; cursor: pointer; border: 1px solid #d1d9e0; background: #f6f8fa; color: inherit; }
      button.primary { border-color: #8250df; background: #8250df; color: #fff; }
      #status { margin: 0; }
      #status.error { color: #cf222e; }
      @media (prefers-color-scheme: dark) {
        body { color: #f0f6fc; background: #0d1117; }
        p, li { color: #9198a1; }
        code { background: #151b23; }
        textarea { color: #f0f6fc; background: #0d1117; border-color: #3d444d; }
        button { border-color: #3d444d; background: #151b23; }
        #status.error { color: #f85149; }
      }
    </style>
  </head>
  <body>
    <h1>PR Docent</h1>
    <h2 data-i18n="guidelinesTitle"></h2>
    <p data-i18n="guidelinesIntro"></p>
    <ul>
      <li data-i18n="guidelinesOrder"></li>
      <li data-i18n="guidelinesLimits"></li>
      <li data-i18n="guidelinesScope"></li>
    </ul>
    <textarea id="guidelines" spellcheck="false"></textarea>
    <div class="row">
      <button id="save" class="primary" data-i18n="guidelinesSave"></button>
      <button id="example" data-i18n="guidelinesExample"></button>
      <p id="status"></p>
    </div>
    <script type="module" src="src/options.js"></script>
  </body>
</html>
